apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-backend
  namespace: traffic-ops-test
spec:
  template:
    spec:
      containers:
      - name: web
        resources:
          limits:
            cpu: 50m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: echo-backend
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
