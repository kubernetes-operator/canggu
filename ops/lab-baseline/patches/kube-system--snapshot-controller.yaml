apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
  namespace: kube-system
spec:
  template:
    spec:
      containers:
      - name: snapshot-controller
        resources:
          limits:
            memory: 300Mi
          requests:
            cpu: 10m
            memory: 47Mi
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: snapshot-controller
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
