apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: nginx-gateway
spec:
  template:
    spec:
      containers:
      - name: nginx-gateway
        resources:
          requests:
            cpu: 5m
            memory: 45Mi
      - name: nginx
        resources:
          requests:
            cpu: 16m
            memory: 38Mi
