[project]
name = "canggu-agent"
version = "0.0.1"
description = "canggu agent — 클러스터당 수집기 + 액추에이터"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "kubernetes>=29.0",   # 실 클러스터 모드. MOCK 모드에서는 미사용.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
