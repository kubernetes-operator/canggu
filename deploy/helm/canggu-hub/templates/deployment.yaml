apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hub
  labels:
    app.kubernetes.io/name: canggu-hub
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: canggu-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canggu-hub
    spec:
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: CANGGU_CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: CANGGU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: databaseUrl
            - name: CANGGU_AGENT_SHARED_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: agentSharedToken
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources: {{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hub
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: canggu-hub
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
