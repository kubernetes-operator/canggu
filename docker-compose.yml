# 로컬 개발 스택. 실제 클러스터/자격증명 불필요 (agent 는 MOCK).
# 웹은 host 에서 `make web` 로 실행 (vite dev 프록시가 hub:8000 로 연결).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canggu
      POSTGRES_PASSWORD: canggu
      POSTGRES_DB: canggu
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canggu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 1+ 에서 텔레메트리 캐시로 사용 (Phase 0 에서는 미사용).
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CANGGU_DATABASE_URL: postgresql+psycopg://canggu:canggu@postgres:5432/canggu
      CANGGU_AGENT_SHARED_TOKEN: dev-token
      CANGGU_CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]

  # 합성 데이터로 동작하는 데모 agent (클러스터 불필요).
  agent-mock:
    build: ./agent
    depends_on: [hub]
    environment:
      CANGGU_MOCK: "1"
      CANGGU_CLUSTER_ID: demo
      CANGGU_CLUSTER_TOKEN: dev-token
      CANGGU_HUB_URL: ws://hub:8000/agentlink/ws
